<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
</head>
<body>
<h2>Books!</h2>
<ul>
    <li th:each="book : ${books}">
        <span th:text="${book.title}"></span>
        <a th:href="@{/books/{book_id}(book_id=${book.id})}">Show more info</a>
        <span> - </span>
        <a th:href="@{/books/{id}/edit(id=${book.id})}">Update book</a>
        <span> - </span>
    </li>
    <form>
        <a type="submit" th:href="@{/books/new}">Create new book</a>
    </form>
</ul>
</body>
</html>
