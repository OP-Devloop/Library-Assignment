<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit book</title>
</head>
<body>
<form method="post" th:action="@{/books/{book_id}(book_id=${book.id})}">
    <p>
        <label>Title: </label>
        <label>
            <input type="text" name="title" th:placeholder="${book.title}" th:value="${book.title}" required>
        </label>
    </p>
    <p>
        <label>Author: </label>
        <label>
            <input type="text" name="author" th:placeholder="${book.author}" th:value="${book.author}" required>
        </label>
    </p>
    <p>
        <label>Year: </label>
        <label>
            <input type="text" name="year" th:placeholder="${book.year}" th:value="${book.year}" required min=1800
                   max=2200>
        </label>
    </p>
    <p>
        <label>Genre: </label>
        <label>
            <input type="text" name="genre" th:placeholder="${book.genre}" th:value="${book.genre}" required>
        </label>
    </p>
    <input type="submit">
    <a th:href="@{/books}">Cancel</a>
</form>
</body>
</html>
