<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>View Movie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>Movie Details</h1>
    <div class="card" style="width: 18rem;">
        <div class="card-body">
            <h5 class="card-title" th:text="${movie.title}">Title</h5>
            <h6 class="card-subtitle mb-2 text-muted" th:text="${movie.director}">Director</h6>
            <p class="card-text">
                <strong>Year:</strong> <span th:text="${movie.releaseYear}">2000</span><br>
                <strong>Genre:</strong> <span th:text="${movie.genre}">Genre</span>
            </p>
            <a th:href="@{/movies/edit/{id}(id=${movie.id})}" class="btn btn-warning">Edit</a>
            <a th:href="@{/movies}" class="btn btn-secondary">Back to List</a>
        </div>
    </div>
</body>
</html>
