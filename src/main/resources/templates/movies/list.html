<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
     <title>Movies</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

     <h1>Movies List</h1>

     <a th:href="@{/movies/new}" class="btn btn-primary mb-3">Add New Movie</a>

     <table class="table table-striped">
         <thead>
             <tr>
                 <th>ID</th>
                 <th>Title</th>
                 <th>Director</th>
                 <th>Release Year</th>
                 <th>Genre</th>
                 <th>Actions</th>
             </tr>
         </thead>
         <tbody>
             <tr th:each="movie : ${movies}">
                 <td th:text="${movie.id}">1</td>
                 <td th:text="${movie.title}">Inception</td>
                 <td th:text="${movie.director}">Christopher Nolan</td>
                 <td th:text="${movie.releaseYear}">2010</td>
                 <td th:text="${movie.genre}">Sci-Fi</td>
                 <td>
                     <a th:href="@{/movies/{id}(id=${movie.id})}" class="btn btn-info btn-sm">View</a>
                     <a th:href="@{/movies/edit/{id}(id=${movie.id})}" class="btn btn-warning btn-sm">Edit</a>
                     <form th:action="@{/movies/delete/{id}(id=${movie.id})}" method="post" style="display:inline;">
                         <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Delete</button>
                     </form>
                 </td>
             </tr>
         </tbody>
     </table>

 </body>
 </html>
