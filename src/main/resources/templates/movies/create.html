<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
     <title>Add New Movie</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>Add New Movie</h1>
    <form th:action="@{/movies/new}" th:object="${movie}" method="post">
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" th:field="*{title}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Director</label>
            <input type="text" th:field="*{director}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Release Year</label>
            <input type="number" th:field="*{releaseYear}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Genre</label>
            <input type="text" th:field="*{genre}" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success">Save Movie</button>
        <a th:href="@{/movies}" class="btn btn-secondary">Cancel</a>
    </form>
</body>
</html>
