<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All games</title>
</head>
<body>
    <h1>All Games</h1>
    <table>
        <thead>
        <tr>
            <th>Title</th>
            <th>Make</th>
            <th>Genre</th>
            <th>Age</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="game : ${games}">
            <td th:text="${game.title}"></td>
            <td th:text="${game.make}"></td>
            <td th:text="${game.genre}"></td>
            <td th:text="${game.age}"></td>
            <td>
                <a th:href="@{/games/edit/{id}(id=${game.id})}">Edit</a>
                <a th:href="@{/games/delete/{id}(id=${game.id})}">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/games/new">Add New Game</a>
</body>
</html>
