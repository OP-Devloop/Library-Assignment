<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New Audiobook</title>
</head>
<body>
<h1>Create New Audiobook</h1>

<form method="POST" th:action="@{/audiobooks}">

    <p>
        <label>Title: </label>
        <input type="text" name="title">
    </p>

    <p>
        <label>Date: </label>
        <input type="text" name="date">
    </p>

    <p>
        <label>Category: </label>
        <input type="text" name="category">
    </p>

    <p>
        <label>Author: </label>
        <input type="text" name="author">
    </p>

    <p>
        <label>Narrator: </label>
        <input type="text" name="narrator">
    </p>

    <button type="submit">Save Audiobook</button>

</form>

</body>
</html>
