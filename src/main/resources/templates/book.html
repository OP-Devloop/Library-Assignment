<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div>
    <h2 th:text="${book.title}"></h2>
</div>

<span th:text="${book.title}"></span> is a <span th:text="${book.genre}"></span> written by <span
        th:text="${book.author}"></span> in <span th:text="${book.year}"></span> -

<a th:href="@{/books}">See all books</a>
<br>
<a th:href="@{/books/{id}/edit(id=${book.id})}">
    <button>Edit</button>
</a>
<br>

<form th:action="@{/books/{id}(id=${book.id})}" method="post" style="display:inline">
    <input type="hidden" name="_method" value="DELETE">
    <button type="submit">Delete</button>
</form>

</body>
</html>
